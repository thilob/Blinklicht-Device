; ============================================================================
; Gemeinsame Konfiguration für alle Boards
; ============================================================================
[common]
lib_deps =
  esphome/ESPAsyncWebServer-esphome @ ^3.1.0
  esphome/AsyncTCP-esphome @ ^2.0.3
  bblanchon/ArduinoJson @ ^7

base_flags =
  -DASYNC_TCP_SSL_ENABLED=0
  -DARDUINOJSON_USE_DOUBLE=0

; ============================================================================
; Board-spezifische Environments
; ============================================================================

; --- ESP32 DevKit (Standard 30-Pin Board) ---
[env:esp32dev]
platform = espressif32 
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_ESP32_DEVKIT

lib_ldf_mode = deep+


; --- ESP32-C3 DevKit M1 (Official Espressif) ---
[env:esp32-c3-devkitm-1]
platform = espressif32 
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_ESP32C3_MINI

lib_ldf_mode = deep+


; --- ESP32-C3 Super Mini (Tiny Board) ---
[env:esp32c3-super-mini]
platform = espressif32 
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_ESP32C3_MINI

lib_ldf_mode = deep+


; --- WiFiduino32 C3 (Alternative C3 Board) ---
[env:wifiduino32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_WIFIDUINO32C3

lib_ldf_mode = deep+


; --- ESP32-S2 Mini ---
[env:esp32s2-mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_ESP32S2_MINI

lib_ldf_mode = deep+


; --- ESP32-S3 DevKit ---
[env:esp32s3-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_ESP32S3_DEVKIT

lib_ldf_mode = deep+


; --- Custom Board Template (kopieren und anpassen) ---
[env:custom]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = ${common.lib_deps}

build_flags =
  ${common.base_flags}
  -DBOARD_CUSTOM

lib_ldf_mode = deep+

