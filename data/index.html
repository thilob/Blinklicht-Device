<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Blaulicht-Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg:#0b0f15; --card:#151b23; --ink:#e9eef5; --muted:#a8b3c5; --accent:#4da3ff; --ok:#2ecc71; --warn:#f39c12; --err:#e74c3c; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:16px; display:flex; align-items:center; justify-content:space-between; background:#0f141b; position:sticky; top:0; z-index:10; }
    h1 { font-size:18px; margin:0; }
    .container { padding:16px; display:grid; gap:16px; grid-template-columns: 1fr; }
    @media (min-width: 900px) { .container { grid-template-columns: 1fr 1fr; } }
    section { background:var(--card); border-radius:12px; padding:16px; box-shadow:0 2px 12px rgba(0,0,0,.25); }
    section h2 { margin:0 0 12px; font-size:18px; }
    label { display:block; font-size:12px; color:var(--muted); margin-top:10px; }
    input, select { width:100%; padding:10px; margin-top:6px; border-radius:8px; border:1px solid #273142; background:#0f141b; color:var(--ink); }
    input[type="checkbox"] { width:auto; transform:scale(1.2); margin-right:8px; }
    .row { display:grid; gap:8px; grid-template-columns: 1fr 1fr; }
    .row3 { display:grid; gap:8px; grid-template-columns: 1fr 1fr 1fr; }
    .btn { background:#1a2330; color:var(--ink); border:1px solid #2b3a4f; padding:10px 12px; border-radius:8px; cursor:pointer; }
    .btn:hover { background:#223044; }
    .btnPrimary { background:var(--accent); color:#001326; border:none; }
    .btnDanger { background:#2a1717; border:1px solid #6b1f1f; color:#ffdede; }
    .list { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
    .item { display:flex; gap:12px; align-items:center; justify-content:space-between; background:#0f141b; border:1px solid #273142; padding:10px; border-radius:8px; }
    .item small { color:var(--muted); }
    .pill { padding:2px 8px; border-radius:999px; background:#112034; border:1px solid #2b3a4f; color:#b6d7ff; font-size:12px; }
    .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#0f141b; color:var(--ink); border:1px solid #2b3a4f; padding:12px 14px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.4); display:none; }
    .grid2 { display:grid; gap:8px; grid-template-columns: 1fr 1fr; }
    .muted { color:var(--muted); }
    code { background:#0f141b; padding:2px 6px; border-radius:6px; border:1px solid #273142; }
  </style>
</head>
<body>
<header>
  <h1>🚨 Blaulicht-Controller</h1>
  <div>
    <button id="btnReload" class="btn">Neu laden</button>
    <button id="btnApply" class="btn btnPrimary">Speichern & anwenden</button>
  </div>
</header>

<div class="container">
  <section>
    <h2>WLAN</h2>
    <label><input type="checkbox" id="wifiEnabled"> WLAN aktiv</label>
    <label>Modus</label>
    <select id="wifiMode">
      <option value="ap">Access Point</option>
      <option value="sta">Station (Client)</option>
    </select>
    <div class="row">
      <div>
        <label>AP SSID</label>
        <input id="apSsid" placeholder="Blaulicht-XXXX">
      </div>
      <div>
        <label>AP Passwort (leer = offen)</label>
        <input id="apPass" type="password" placeholder="">
      </div>
    </div>
    <div class="row">
      <div>
        <label>STA SSID</label>
        <input id="staSsid">
      </div>
      <div>
        <label>STA Passwort</label>
        <input id="staPass" type="password">
      </div>
    </div>
    <p class="muted" id="wifiHint"></p>
  </section>

  <section>
    <h2>System</h2>
    <div id="sysinfo" class="grid2 muted"></div>
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button id="btnReboot" class="btn">Neustart</button>
      <button id="btnDhcp" class="btn">DHCP erneuern (STA)</button>
    </div>
    <p class="muted" style="margin-top:8px;">Im STA-Modus kannst du die Seite meist auch über <code>http://&lt;hostname&gt;.local/</code> öffnen.</p>
  </section>

  <section>
    <h2>Gruppen</h2>
    <div class="row">
      <input id="gId" type="number" placeholder="ID">
      <input id="gName" placeholder="Name">
    </div>
    <label><input type="checkbox" id="gEnabled" checked> Gruppe eingeschaltet</label>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button id="btnGroupAdd" class="btn">Gruppe hinzufügen/ersetzen</button>
      <button id="btnGroupDel" class="btn btnDanger">Gruppe löschen</button>
    </div>
    <div id="groupList" class="list"></div>
  </section>

  <section>
    <h2>Patterns</h2>
    <div class="row">
      <input id="pName" placeholder="Pattern-Name">
      <button id="btnPatternAdd" class="btn">Pattern anlegen</button>
    </div>
    <div id="patternList" class="list"></div>
  </section>

  <section style="grid-column:1/-1">
    <h2>Lights (Ausgänge)</h2>
    <div class="row3">
      <input id="lIdx" type="number" placeholder="Index (optional)">
      <input id="lPin" type="number" placeholder="Pin">
      <input id="lCh" type="number" placeholder="LEDC-Kanal">
    </div>
    <div class="row3">
      <input id="lPat" type="number" placeholder="Pattern-Index">
      <input id="lRest" type="number" placeholder="Rest-Override ms (-1)">
      <input id="lGid" type="number" placeholder="Group-ID">
    </div>
    <div class="row">
      <input id="lPhase" type="number" placeholder="Phasenverschiebung ms">
      <button id="btnLightAdd" class="btn">Ausgang hinzufügen/ersetzen</button>
      <button id="btnLightDel" class="btn btnDanger">Ausgang löschen (Index)</button>
    </div>
    <div id="lightList" class="list"></div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script>
let cfg = null;

function toast(msg, kind="info"){
  const t=document.getElementById('toast');
  t.textContent = msg;
  t.style.display='block';
  t.style.borderColor = kind==="error" ? "#e74c3c" : (kind==="warn"?"#f39c12":"#2b3a4f");
  setTimeout(()=>t.style.display='none', 2500);
}

async function loadConfig(){
  const r = await fetch('/api/config');
  if(!r.ok){ toast('Config laden fehlgeschlagen','error'); return; }
  cfg = await r.json();
  render();
  await loadSysInfo();
}

async function loadSysInfo(){
  const r = await fetch('/api/sysinfo');
  if(!r.ok) return;
  const s = await r.json();
  const el = document.getElementById('sysinfo');
  el.innerHTML = `
    <div>LEDC Kanäle gesamt<br><b>${s.max_ledc_channels}</b></div>
    <div>Frequenz<br><b>${s.ledc_freq_hz} Hz</b></div>
    <div>Auflösung<br><b>${s.ledc_res_bits} Bit</b></div>
    <div>Lights im Einsatz<br><b>${s.num_lights}</b></div>
  `;
}

function render(){
  // WLAN
  document.getElementById('wifiEnabled').checked = !!cfg.wifi.enabled;
  document.getElementById('wifiMode').value = cfg.wifi.mode || "ap";
  document.getElementById('apSsid').value = cfg.wifi.ap?.ssid || "";
  document.getElementById('apPass').value = cfg.wifi.ap?.password || "";
  document.getElementById('staSsid').value = cfg.wifi.sta?.ssid || "";
  document.getElementById('staPass').value = cfg.wifi.sta?.password || "";

  const hint = document.getElementById('wifiHint');
  if (cfg.wifi.mode === 'sta') {
    hint.textContent = "Hinweis: Nach Anwenden verbindet sich das Gerät mit deinem WLAN. Öffne dann die Seite über die neue IP oder http://<hostname>.local/";
  } else {
    hint.textContent = "Der Access-Point ist direkt erreichbar. AP-Passwort leer = offenes WLAN.";
  }

  // Gruppen
  const gl = document.getElementById('groupList');
  gl.innerHTML = (cfg.groups||[]).map(g=>`
    <div class="item">
      <div><b>${g.name}</b> <span class="pill">id=${g.id}</span> <small>${g.enabled?"ON":"OFF"}</small></div>
      <button class="btn" onclick="prefillGroup(${g.id})">Bearbeiten…</button>
    </div>
  `).join('') || '<div class="muted">Keine Gruppen.</div>';

  // Patterns
  const pl = document.getElementById('patternList');
  pl.innerHTML = (cfg.patterns||[]).map((p,i)=>{
    const steps = (p.steps||[]).map((s,si)=>`<li><code>#${si}</code> dur=${s.duration_ms}ms lvl=${s.level} fade=${s.fade}</li>`).join('');
    return `
      <div class="item" style="align-items:flex-start">
        <div style="flex:1">
          <div><b>[${i}] ${p.name}</b></div>
          <ul class="muted" style="margin:6px 0 0 0; padding-left:18px">${steps||"<li>leer</li>"}</ul>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="btn" onclick="addStep(${i})">Step +</button>
          <button class="btn" onclick="editStep(${i})">Step ändern</button>
          <button class="btn btnDanger" onclick="delPattern(${i})">Pattern löschen</button>
        </div>
      </div>
    `;
  }).join('') || '<div class="muted">Keine Patterns.</div>';

  // Lights
  const ll = document.getElementById('lightList');
  ll.innerHTML = (cfg.lights||[]).map((L,i)=>`
    <div class="item">
      <div>
        <b>L${i}</b> <span class="pill">pin=${L.pin}</span>
        <span class="pill">ch=${L.channel}</span>
        <span class="pill">pat=${L.patternIndex}</span>
        <span class="pill">rest=${L.restOverrideMs}</span>
        <span class="pill">gid=${L.groupId}</span>
        <span class="pill">phase=${L.phase_ms}</span>
      </div>
      <button class="btn" onclick="prefillLight(${i})">Bearbeiten…</button>
    </div>
  `).join('') || '<div class="muted">Keine Ausgänge.</div>';
}

// ------- Gruppen UI -------
function prefillGroup(id){
  const g=(cfg.groups||[]).find(x=>x.id==id); if(!g) return;
  document.getElementById('gId').value = g.id;
  document.getElementById('gName').value = g.name;
  document.getElementById('gEnabled').checked = !!g.enabled;
}
document.getElementById('btnGroupAdd').onclick = ()=>{
  const id = parseInt(document.getElementById('gId').value||0,10);
  const name = document.getElementById('gName').value||"Gruppe";
  const en = document.getElementById('gEnabled').checked;
  if(!cfg.groups) cfg.groups=[];
  let g = cfg.groups.find(x=>x.id===id);
  if (g) { g.name=name; g.enabled=en; } else { cfg.groups.push({id, name, enabled:en}); }
  render();
};
document.getElementById('btnGroupDel').onclick = ()=>{
  const id = parseInt(document.getElementById('gId').value||-1,10);
  if(id<0) return;
  cfg.groups = (cfg.groups||[]).filter(x=>x.id!==id);
  render();
};

// ------- Patterns UI -------
document.getElementById('btnPatternAdd').onclick = ()=>{
  const name = document.getElementById('pName').value || ("Pattern"+(cfg.patterns?.length||0));
  if(!cfg.patterns) cfg.patterns=[];
  cfg.patterns.push({name, steps:[]});
  render();
};
function delPattern(i){
  if(!cfg.patterns) return;
  cfg.patterns.splice(i,1);
  render();
}
function addStep(pidx){
  const dur = parseInt(prompt("Dauer (ms)", "30")||"0",10);
  const lvl = parseInt(prompt("Level (0..255)", "255")||"0",10);
  const fade= !!parseInt(prompt("Fade (0/1)", "0")||"0",10);
  cfg.patterns[pidx].steps.push({duration_ms:dur, level:lvl, fade});
  render();
}
function editStep(pidx){
  const sidx = parseInt(prompt("Step-Index", "0")||"0",10);
  const st = cfg.patterns[pidx].steps?.[sidx]; if(!st){ toast("Step nicht gefunden","error"); return; }
  const dur = parseInt(prompt("Dauer (ms)", String(st.duration_ms))||"0",10);
  const lvl = parseInt(prompt("Level (0..255)", String(st.level))||"0",10);
  const fade= !!parseInt(prompt("Fade (0/1)", st.fade?"1":"0")||"0",10);
  cfg.patterns[pidx].steps[sidx] = {duration_ms:dur, level:lvl, fade};
  render();
}

// ------- Lights UI -------
function prefillLight(i){
  const L = (cfg.lights||[])[i]; if(!L) return;
  document.getElementById('lIdx').value = i;
  document.getElementById('lPin').value = L.pin;
  document.getElementById('lCh').value  = L.channel;
  document.getElementById('lPat').value = L.patternIndex;
  document.getElementById('lRest').value= L.restOverrideMs;
  document.getElementById('lGid').value = L.groupId;
  document.getElementById('lPhase').value=L.phase_ms;
}
document.getElementById('btnLightAdd').onclick = ()=>{
  const idx   = document.getElementById('lIdx').value==="" ? -1 : parseInt(document.getElementById('lIdx').value,10);
  const pin   = parseInt(document.getElementById('lPin').value||"0",10);
  const ch    = parseInt(document.getElementById('lCh').value||"0",10);
  const pidx  = parseInt(document.getElementById('lPat').value||"0",10);
  const rest  = parseInt(document.getElementById('lRest').value||"-1",10);
  const gid   = parseInt(document.getElementById('lGid').value||"0",10);
  const phase = parseInt(document.getElementById('lPhase').value||"0",10);
  if(!cfg.lights) cfg.lights=[];
  const L = {pin, channel:ch, patternIndex:pidx, restOverrideMs:rest, groupId:gid, phase_ms:phase};
  if (idx>=0 && idx<cfg.lights.length) cfg.lights[idx]=L; else cfg.lights.push(L);
  render();
};
document.getElementById('btnLightDel').onclick = ()=>{
  const idx = parseInt(document.getElementById('lIdx').value||"-1",10);
  if (idx>=0 && idx<cfg.lights.length) { cfg.lights.splice(idx,1); render(); }
};

// ------- Apply / Reboot / DHCP -------
document.getElementById('btnApply').onclick = async ()=>{
  // WLAN übernehmen
  cfg.wifi = cfg.wifi || {};
  cfg.wifi.enabled = document.getElementById('wifiEnabled').checked;
  cfg.wifi.mode    = document.getElementById('wifiMode').value;
  cfg.wifi.ap = {
    ssid: document.getElementById('apSsid').value,
    password: document.getElementById('apPass').value
  };
  cfg.wifi.sta = {
    ssid: document.getElementById('staSsid').value,
    password: document.getElementById('staPass').value
  };

  const r = await fetch('/api/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cfg) });
  if (r.ok) {
    toast('Gespeichert. Anwenden…');
    // Hinweis bei STA
    if (cfg.wifi.enabled && cfg.wifi.mode==='sta') {
      alert('Konfiguration angewendet.\nDas Gerät verbindet sich jetzt mit deinem WLAN.\nÖffne danach http://<hostname>.local/ oder die vergebene IP.');
    }
  } else {
    toast('Fehler beim Speichern','error');
  }
};
document.getElementById('btnReload').onclick = ()=>loadConfig();
document.getElementById('btnReboot').onclick = ()=>{ fetch('/api/sysinfo'); location.reload(); };
document.getElementById('btnDhcp').onclick = ()=>{
  // Kein separater Endpoint—nutze einfach Hinweis:
  alert('DHCP erneuern kannst du über die serielle CLI mit dem Befehl "dhcp".');
};

// Init
loadConfig().catch(()=>toast('Init fehlgeschlagen','error'));
</script>
</body>
</html>
