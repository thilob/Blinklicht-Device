<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Blaulicht-Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#22d3ee; --bad:#ef4444; --good:#22c55e;
      --border:#1f2937;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    header h1{margin:0;font-size:18px;font-weight:600}
    header .pill{font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted)}
    main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
    @media(min-width:900px){main{grid-template-columns:1fr 1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    h2{margin:0 0 12px 0;font-size:16px}
    label{font-size:12px;color:var(--muted)}
    input,select,button,textarea{
      width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#0b1220;color:var(--text);
    }
    input[type="checkbox"]{width:auto}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .mt8{margin-top:8px}
    .mt12{margin-top:12px}
    .mt16{margin-top:16px}
    .muted{color:var(--muted);font-size:12px}
    .btn{cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,#06b6d4,#22d3ee);border:none;color:#001018;font-weight:600}
    .btn.danger{background:#3b0f13;border-color:#651b1f;color:#fecaca}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left;font-size:14px}
    th{color:#9ca3af}
    .flex{display:flex;gap:8px;align-items:center}
    .right{justify-content:flex-end}
    .ok{color:var(--good)} .bad{color:var(--bad)}
  </style>
</head>
<body>
  <header>
    <h1>🚨 Blaulicht-Controller</h1>
    <span id="badgeMode" class="pill">…</span>
    <span id="badgeHost" class="pill">…</span>
  </header>

  <main>
    <!-- WLAN -->
    <section class="card">
      <h2>WLAN</h2>
      <div class="row">
        <div>
          <label><input type="checkbox" id="wifi_enabled"> WLAN aktiv</label>
        </div>
        <div>
          <label for="wifi_mode">Modus</label>
          <select id="wifi_mode">
            <option value="ap">Access Point</option>
            <option value="sta">Station (Client)</option>
          </select>
        </div>
      </div>

      <div class="row mt12">
        <div>
          <label for="ap_ssid">AP SSID</label>
          <input id="ap_ssid" placeholder="leer = automatisch">
        </div>
        <div>
          <label for="ap_pass">AP Passwort (optional)</label>
          <input id="ap_pass" placeholder="leer = offen">
        </div>
      </div>

      <div class="row mt12">
        <div>
          <label for="sta_ssid">STA SSID</label>
          <input id="sta_ssid" placeholder="WLAN-Name des Routers">
        </div>
        <div>
          <label for="sta_pass">STA Passwort</label>
          <input id="sta_pass" placeholder="WLAN-Passwort">
        </div>
      </div>

      <div class="flex right mt16">
        <button class="btn" id="btnReloadWifi">WLAN-Status</button>
        <button class="btn primary" id="btnSaveWifi">Speichern & Anwenden (WLAN)</button>
      </div>
      <p class="muted mt8">Im STA-Modus zusätzlich unter <b>http://&lt;hostname&gt;.local</b> erreichbar (mDNS).</p>
    </section>

    <!-- Gruppen -->
    <section class="card">
      <h2>Gruppen</h2>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Aktiv</th><th></th></tr></thead>
        <tbody id="tblGroups"></tbody>
      </table>
      <div class="row mt12">
        <input id="g_id" placeholder="ID (Zahl)">
        <input id="g_name" placeholder="Name">
      </div>
      <div class="flex right mt12">
        <button class="btn" id="btnGroupAdd">Gruppe anlegen</button>
      </div>
    </section>

    <!-- Patterns -->
    <section class="card">
      <h2>Patterns</h2>
      <div class="row">
        <div>
          <label for="pat_name">Pattern-Name</label>
          <input id="pat_name" placeholder="z. B. DoppelStrobe">
        </div>
        <div class="flex right">
          <button class="btn" id="btnPatAdd">Leeres Pattern anlegen</button>
        </div>
      </div>

      <div class="mt12">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Steps</th><th></th></tr></thead>
          <tbody id="tblPat"></tbody>
        </table>
      </div>

      <div class="mt12">
        <h3 style="margin:0 0 8px 0;font-size:14px;color:#9ca3af">Steps in ausgewähltem Pattern</h3>
        <div class="row3">
          <input id="st_dur" placeholder="Dauer ms">
          <input id="st_lvl" placeholder="Level 0..255">
          <select id="st_fade"><option value="0">hart</option><option value="1">weich</option></select>
        </div>
        <div class="flex right mt12">
          <button class="btn" id="btnStepAdd">Step hinzufügen</button>
        </div>
        <table class="mt12">
          <thead><tr><th>#</th><th>Dauer</th><th>Level</th><th>Fade</th><th></th></tr></thead>
          <tbody id="tblSteps"></tbody>
        </table>
      </div>
    </section>

    <!-- Lights -->
    <section class="card">
      <h2>Ausgänge</h2>
      <table>
        <thead><tr><th>#</th><th>Pin</th><th>Ch</th><th>Pat</th><th>Rest</th><th>Grp</th><th>Phase</th><th></th></tr></thead>
        <tbody id="tblLights"></tbody>
      </table>

      <div class="row3 mt12">
        <input id="l_pin"   placeholder="Pin">
        <input id="l_ch"    placeholder="LEDC">
        <input id="l_pidx"  placeholder="Pattern">
      </div>
      <div class="row3 mt12">
        <input id="l_rest"  placeholder="Rest ms (-1)">
        <input id="l_gid"   placeholder="Gruppe-ID">
        <input id="l_phase" placeholder="Phase ms">
      </div>
      <div class="flex right mt12">
        <button class="btn" id="btnLightAdd">Ausgang anlegen</button>
      </div>
    </section>

    <!-- Aktionen -->
    <section class="card">
      <h2>Aktionen</h2>
      <div class="flex right">
        <button class="btn" id="btnSaveLogic">Speichern (Logik)</button>
        <button class="btn danger" id="btnReloadPage">Se
